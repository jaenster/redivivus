<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>Bytes of the original game code by kind of match</title>
<rect width="800" height="280" rx="6" fill="#ffffff"/>
<text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">Original game code, C runtime and compiler EH stubs left out: 2,602,915 bytes</text>
<rect x="24.00" y="52" width="138.39" height="30" fill="#1f6feb"/>
<text x="93.20" y="71" font-size="12" text-anchor="middle" fill="#ffffff">18.4%</text>
<rect x="162.39" y="52" width="365.88" height="30" fill="#79b8ff"/>
<text x="345.33" y="71" font-size="12" text-anchor="middle" fill="#000000">48.6%</text>
<rect x="528.28" y="52" width="113.95" height="30" fill="#e3b341"/>
<text x="585.25" y="71" font-size="12" text-anchor="middle" fill="#000000">15.2%</text>
<rect x="642.23" y="52" width="113.47" height="30" fill="#d1d5da"/>
<text x="698.96" y="71" font-size="12" text-anchor="middle" fill="#000000">15.1%</text>
<rect x="755.69" y="52" width="9.54" height="30" fill="#eceff3"/>
<rect x="765.24" y="52" width="10.76" height="30" fill="#9aa4ae"/>
<rect x="24" y="52" width="752" height="30" fill="none" stroke="#d1d9e0"/>
<rect x="24" y="101" width="14" height="14" rx="2" fill="#1f6feb" stroke="#d1d9e0"/>
<text x="46" y="112" font-size="13" fill="#1f2328">Whole function identical</text>
<text x="334" y="112" font-size="13" text-anchor="end" fill="#1f2328">479,019</text>
<text x="398" y="112" font-size="13" text-anchor="end" fill="#1f2328">18.40%</text>
<text x="416" y="112" font-size="12" fill="#59636e">functions that compile to the original bytes (MATCH)</text>
<rect x="24" y="127" width="14" height="14" rx="2" fill="#79b8ff" stroke="#d1d9e0"/>
<text x="46" y="138" font-size="13" fill="#1f2328">Matching instructions</text>
<text x="334" y="138" font-size="13" text-anchor="end" fill="#1f2328">1,266,444</text>
<text x="398" y="138" font-size="13" text-anchor="end" fill="#1f2328">48.65%</text>
<text x="416" y="138" font-size="12" fill="#59636e">already right, but the function still differs elsewhere</text>
<rect x="24" y="153" width="14" height="14" rx="2" fill="#e3b341" stroke="#d1d9e0"/>
<text x="46" y="164" font-size="13" fill="#1f2328">Same instruction, other operands</text>
<text x="334" y="164" font-size="13" text-anchor="end" fill="#1f2328">394,425</text>
<text x="398" y="164" font-size="13" text-anchor="end" fill="#1f2328">15.15%</text>
<text x="416" y="164" font-size="12" fill="#59636e">same instruction, other registers or offsets</text>
<rect x="24" y="179" width="14" height="14" rx="2" fill="#d1d5da" stroke="#d1d9e0"/>
<text x="46" y="190" font-size="13" fill="#1f2328">Different instructions</text>
<text x="334" y="190" font-size="13" text-anchor="end" fill="#1f2328">392,742</text>
<text x="398" y="190" font-size="13" text-anchor="end" fill="#1f2328">15.09%</text>
<text x="416" y="190" font-size="12" fill="#59636e">instructions with no matching partner</text>
<rect x="24" y="205" width="14" height="14" rx="2" fill="#eceff3" stroke="#d1d9e0"/>
<text x="46" y="216" font-size="13" fill="#1f2328">Tables and padding</text>
<text x="334" y="216" font-size="13" text-anchor="end" fill="#1f2328">33,027</text>
<text x="398" y="216" font-size="13" text-anchor="end" fill="#1f2328">1.27%</text>
<text x="416" y="216" font-size="12" fill="#59636e">switch tables and padding in functions that still differ</text>
<rect x="24" y="231" width="14" height="14" rx="2" fill="#9aa4ae" stroke="#d1d9e0"/>
<text x="46" y="242" font-size="13" fill="#1f2328">Not compared</text>
<text x="334" y="242" font-size="13" text-anchor="end" fill="#1f2328">37,258</text>
<text x="398" y="242" font-size="13" text-anchor="end" fill="#1f2328">1.43%</text>
<text x="416" y="242" font-size="12" fill="#59636e">original functions with no counterpart compared</text>
</svg>
