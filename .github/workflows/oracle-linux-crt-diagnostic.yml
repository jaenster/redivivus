name: oracle-linux-parity-diagnostic

# Temporary PR diagnostic: retail VC8 libraries and the same pinned TypeScript
# translator as the Windows oracle workflow, followed by a fresh CRT and full audit.
on:
  pull_request:
    paths:
      - 'asm_matching/msvc8/zig/**'
      - '.github/workflows/oracle-linux-crt-diagnostic.yml'

permissions:
  contents: read

jobs:
  crt:
    name: Linux retail VC8 oracle parity
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GAME_EXE_URL: https://files.typeguru.nl/diablo/diablo2/windows/lod/1.14d/Game.exe
      GAME_EXE_SHA256: 631066c1649c4ea9ffe48bf97e24c00bca1f7a6759c21150f1a79982589adaaf
      VC8_TOOLCHAIN: ${{ github.workspace }}/../vc8-toolchain
      D2_GAME_EXE: ${{ github.workspace }}/../ref114d/Game.exe
    steps:
      - uses: actions/checkout@v4

      - name: Check out the pinned VC8 translator
        run: |
          git clone https://github.com/jaenster/ghidra-reconstruct.git "$RUNNER_TEMP/ghidra-reconstruct"
          git -C "$RUNNER_TEMP/ghidra-reconstruct" checkout --detach 29d57d412d15ef7bcd671bce0731ba303221c2aa
          test "$(git -C "$RUNNER_TEMP/ghidra-reconstruct" rev-parse HEAD)" = 29d57d412d15ef7bcd671bce0731ba303221c2aa
          echo "GR=$RUNNER_TEMP/ghidra-reconstruct" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the pinned translator
        run: |
          cd "$GR"
          pnpm install --frozen-lockfile
          pnpm build

      - name: Tools used by the existing Linux oracle
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine wine32:i386 wine64 p7zip-full cabextract msitools faketime curl >/dev/null
          if ! command -v wineserver >/dev/null; then
            ws=$(ls /usr/lib/x86_64-linux-gnu/wine/wineserver /usr/lib/wine/wineserver64 /usr/lib/wine/wineserver \
                    /usr/lib/i386-linux-gnu/wine/wineserver /usr/lib/wine/wineserver32 2>/dev/null | head -1)
            [ -n "$ws" ] || { echo 'no wineserver under /usr/lib' >&2; exit 1; }
            mkdir -p "$HOME/.local/bin" && ln -sf "$ws" "$HOME/.local/bin/wineserver"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build Zig CRT mapper
        working-directory: asm_matching/msvc8/zig
        run: zig build --release=fast

      - name: Fetch and verify the 1.14d reference
        run: |
          mkdir -p "$(dirname "$D2_GAME_EXE")"
          curl -sfL --retry 3 "$GAME_EXE_URL" -o "$D2_GAME_EXE"
          echo "$GAME_EXE_SHA256  $D2_GAME_EXE" | sha256sum -c -

      - name: Restore the existing oracle toolchain cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VC8_TOOLCHAIN }}
          key: vc8-toolchain-${{ hashFiles('asm_matching/msvc8/scripts/setup_toolchain.sh') }}

      - name: Set up retail-media RTM and SP1 libraries
        run: asm_matching/msvc8/oracle setup

      - name: Hash both library revisions and compare CRT rows
        run: |
          set -euo pipefail
          base="$VC8_TOOLCHAIN/wine-vc8/drive_c/vc8"
          for ver in rtm sp1; do
            for lib in libcmt.lib libcpmt.lib; do
              f="$base/$ver/lib/$lib"
              test -f "$f"
              sha256sum "$f" | tee -a crt-libraries.sha256
            done
          done
          asm_matching/msvc8/oracle crt
          cat asm_matching/msvc8/evidence/crtmap.tsv.summary

      - name: Run full oracle with the pinned translator
        run: |
          asm_matching/msvc8/zig/zig-out/bin/oracle-zig build --probe
          git rev-parse HEAD | tee oracle-checkout.sha
          asm_matching/msvc8/oracle all
          cat asm_matching/msvc8/evidence/libmap.tsv.summary
          cat asm_matching/msvc8/evidence/audit.tsv.summary

      - name: Hash the complete mapping and audit rows
        run: |
          set -euo pipefail
          for name in funcmap.tsv libmap.tsv audit.tsv datamap.tsv; do
            file="asm_matching/msvc8/evidence/$name"
            hash=$(sha256sum "$file" | cut -d ' ' -f 1)
            printf '%s  %s\n' "$hash" "$name"
          done | tee oracle-row-digests.sha256

      - name: Keep names, addresses, counts, and hashes only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-linux-crt-diagnostic
          path: |
            crt-libraries.sha256
            oracle-checkout.sha
            oracle-row-digests.sha256
            asm_matching/msvc8/evidence/crtmap.tsv
            asm_matching/msvc8/evidence/crtmap.tsv.summary
            asm_matching/msvc8/evidence/libmap.tsv.summary
            asm_matching/msvc8/evidence/audit.tsv.summary
          if-no-files-found: warn
