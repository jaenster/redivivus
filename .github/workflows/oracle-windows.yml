name: oracle-windows

# Exercise the native Windows oracle on changes to its Zig implementation.
# The existing oracle.yml remains the main-branch Linux audit.
on:
  pull_request:
    paths:
      - 'asm_matching/msvc8/zig/**'
      - '.github/workflows/oracle-windows.yml'

permissions:
  contents: read

concurrency:
  group: oracle-windows-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    name: Native VC8 oracle
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GAME_EXE_URL: https://files.typeguru.nl/diablo/diablo2/windows/lod/1.14d/Game.exe
      GAME_EXE_SHA256: 631066c1649c4ea9ffe48bf97e24c00bca1f7a6759c21150f1a79982589adaaf
    steps:
      - name: Preserve source line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Check out the VC8 translator outside the source tree
        shell: pwsh
        run: |
          $gr = Join-Path $env:RUNNER_TEMP 'ghidra-reconstruct'
          git clone https://github.com/jaenster/ghidra-reconstruct.git $gr
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $gr checkout --detach 29d57d412d15ef7bcd671bce0731ba303221c2aa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = (& git -C $gr rev-parse HEAD).Trim()
          if ($actual -ne '29d57d412d15ef7bcd671bce0731ba303221c2aa') { throw "Wrong translator commit: $actual" }
          "GR=$gr" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the translator
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:GR
          pnpm install --frozen-lockfile
          pnpm build

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # The action checks each cl.exe banner and verifies its pinned package hash.
      # RTM comes first so the final INCLUDE/LIB environment belongs to SP1.
      - name: Set up Visual C++ 2005 RTM libraries
        id: rtm
        uses: jaenster/setup-msvc@843b5c50f974286ab28da9640898650d4346daa0 # v1
        with:
          version: '14.00.50727.42'
          runner: native
          cache: 'true'

      - name: Set up Visual C++ 2005 SP1
        id: sp1
        uses: jaenster/setup-msvc@843b5c50f974286ab28da9640898650d4346daa0 # v1
        with:
          version: '14.00.50727.762'
          runner: native
          cache: 'true'

      - name: Verify and stage the exact CRT archives
        shell: pwsh
        env:
          RTM_ROOT: ${{ steps.rtm.outputs.root }}
          RTM_VERSION: ${{ steps.rtm.outputs.version }}
          RTM_CAN_LINK: ${{ steps.rtm.outputs.can-link }}
          SP1_ROOT: ${{ steps.sp1.outputs.root }}
          SP1_BIN: ${{ steps.sp1.outputs.bin }}
          SP1_VERSION: ${{ steps.sp1.outputs.version }}
          SP1_CAN_LINK: ${{ steps.sp1.outputs.can-link }}
        run: |
          if ($env:RTM_VERSION -ne '14.00.50727.42' -or $env:SP1_VERSION -ne '14.00.50727.762') {
            throw "Wrong VC8 versions: RTM=$env:RTM_VERSION SP1=$env:SP1_VERSION"
          }
          if ($env:RTM_CAN_LINK -ne 'true' -or $env:SP1_CAN_LINK -ne 'true') {
            throw 'Both VC8 installs need runtime libraries'
          }
          $nativeRoot = Join-Path $env:RUNNER_TEMP 'vc8-native'
          $expected = @{
            rtm = @{ 'libcmt.lib' = '7fb99b9594299faeef938366bd7e73e967c8dbd9'; 'libcpmt.lib' = '1e9ffb813ccf7d41533299c9e80c7645805245ef' }
            sp1 = @{ 'libcmt.lib' = 'c87e83f5bd5fe05223c7dca645b17793ad3909b9'; 'libcpmt.lib' = '836f06d085574f8e68ae132ccabb14e5db276326' }
          }
          foreach ($version in @('rtm', 'sp1')) {
            $sourceRoot = if ($version -eq 'rtm') { $env:RTM_ROOT } else { $env:SP1_ROOT }
            $target = Join-Path $nativeRoot "$version/lib"
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            foreach ($name in @('libcmt.lib', 'libcpmt.lib')) {
              $source = Join-Path $sourceRoot "lib/$name"
              if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "Missing $source" }
              $actual = (& git hash-object -- $source).Trim()
              if ($LASTEXITCODE -ne 0 -or $actual -ne $expected[$version][$name]) {
                throw "Unexpected $version $name Git blob: $actual"
              }
              Copy-Item -LiteralPath $source -Destination $target
            }
          }
          "VC8_NATIVE_ROOT=$nativeRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VC8_NATIVE_CL=$(Join-Path $env:SP1_BIN 'cl.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fetch the pinned Diablo II reference image
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'asm_matching/msvc8/reference/Game.exe'
          New-Item -ItemType Directory -Force -Path (Split-Path $exe) | Out-Null
          Invoke-WebRequest -Uri $env:GAME_EXE_URL -OutFile $exe
          $actual = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:GAME_EXE_SHA256) { throw "Game.exe SHA256 mismatch: $actual" }

      - name: Build the native Zig oracle
        working-directory: asm_matching/msvc8/zig
        shell: pwsh
        run: zig build --release=fast

      - name: Compare RTM and SP1 CRT provenance
        shell: pwsh
        run: |
          $oracle = Join-Path $env:GITHUB_WORKSPACE 'asm_matching/msvc8'
          & "$oracle/zig/zig-out/bin/oracle-zig.exe" crt --root $oracle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build, map, and audit every function
        shell: pwsh
        run: |
          $oracle = Join-Path $env:GITHUB_WORKSPACE 'asm_matching/msvc8'
          & "$oracle/zig/zig-out/bin/oracle-zig.exe" all --root $oracle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compare summaries with the checked-in oracle baseline
        shell: pwsh
        run: |
          foreach ($name in @('crtmap.tsv.summary', 'libmap.tsv.summary', 'audit.tsv.summary')) {
            $relative = "asm_matching/msvc8/evidence/$name"
            $expected = @(& git show "HEAD:$relative")
            if ($LASTEXITCODE -ne 0) { throw "Missing checked-in baseline: $relative" }
            $actual = @(Get-Content -LiteralPath $relative)
            # The first audit line includes a source-tree stamp and flags; the
            # remaining lines carry the function and byte counts to compare.
            if ($name -eq 'audit.tsv.summary') {
              $expected = @($expected | Select-Object -Skip 1)
              $actual = @($actual | Select-Object -Skip 1)
            }
            if ([string]::Join("`n", $actual) -cne [string]::Join("`n", $expected)) {
              throw "$name differs from the checked-in oracle baseline"
            }
          }

      - name: Summarize native results
        if: always()
        shell: pwsh
        run: |
          '## Native Windows VC8 oracle' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          foreach ($name in @('crtmap.tsv.summary', 'libmap.tsv.summary', 'audit.tsv.summary')) {
            $file = Join-Path $env:GITHUB_WORKSPACE "asm_matching/msvc8/evidence/$name"
            if (Test-Path -LiteralPath $file) {
              "### $name" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              Get-Content -LiteralPath $file | Select-Object -First 20 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
          }

      - name: Keep summaries only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-windows-summaries
          path: asm_matching/msvc8/evidence/*.summary
          if-no-files-found: warn
