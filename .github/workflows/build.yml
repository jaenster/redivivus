name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.recomp.json', 'progress/**', '.github/workflows/progress.yml']
  pull_request:
    paths-ignore: ['**.md', '.recomp.json', 'progress/**', '.github/workflows/progress.yml']
  workflow_dispatch:

# A newer push makes an older build of the same ref pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mingw-i686:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-mingw-w64-i686 binutils-mingw-w64-i686 cmake ninja-build ccache

      # The compile cache. A run saves under its own sha and restores the newest
      # earlier one, so an unchanged translation unit is not compiled again.
      - name: Restore the compile cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-mingw-i686-${{ github.sha }}
          restore-keys: ccache-mingw-i686-

      - name: Build from a clean clone
        env:
          CHECK_BUILD_WORK: ${{ runner.temp }}/redivivus
        run: |
          export CCACHE_DIR=$HOME/.cache/ccache CCACHE_MAXSIZE=2G CCACHE_COMPRESS=true
          tools/check-build.sh "$GITHUB_WORKSPACE" "$GITHUB_SHA"
